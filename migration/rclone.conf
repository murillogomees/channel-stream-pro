# =============================================================================
# SUPABASE MIGRATION: rclone Configuration
# Alternativa para migração de Storage usando S3-compatible API
# =============================================================================
#
# INSTRUÇÕES:
# 1. Instale rclone: https://rclone.org/install/
# 2. Copie este arquivo para ~/.config/rclone/rclone.conf
# 3. Substitua os placeholders pelos valores reais
# 4. Execute: rclone sync supabase-origin:bucket-name supabase-dest:bucket-name
#
# =============================================================================

# -----------------------------------------------------------------------------
# ORIGEM: Supabase Cloud Storage (S3-compatible)
# -----------------------------------------------------------------------------
[supabase-origin]
type = s3
provider = Other
env_auth = false
access_key_id = {{S3_ACCESS_KEY_ORIGIN}}
secret_access_key = {{S3_SECRET_KEY_ORIGIN}}
endpoint = https://{{PROJECT_REF_ORIGIN}}.supabase.co/storage/v1/s3
# Se não tiver credenciais S3, use o copy_storage.js ao invés de rclone

# -----------------------------------------------------------------------------
# DESTINO: Supabase Self-Hosted Storage (S3-compatible)
# -----------------------------------------------------------------------------
[supabase-dest]
type = s3
provider = Other
env_auth = false
access_key_id = {{S3_ACCESS_KEY_DEST}}
secret_access_key = {{S3_SECRET_KEY_DEST}}
endpoint = {{SUPABASE_URL_DEST}}/storage/v1/s3

# -----------------------------------------------------------------------------
# COMANDOS RCLONE
# -----------------------------------------------------------------------------
#
# Listar buckets na origem:
#   rclone lsd supabase-origin:
#
# Listar arquivos de um bucket:
#   rclone ls supabase-origin:bucket-name
#
# Copiar bucket inteiro:
#   rclone copy supabase-origin:bucket-name supabase-dest:bucket-name -P
#
# Sincronizar (espelhar):
#   rclone sync supabase-origin:bucket-name supabase-dest:bucket-name -P
#
# Verificar diferenças:
#   rclone check supabase-origin:bucket-name supabase-dest:bucket-name
#
# Opções úteis:
#   -P          : Mostrar progresso
#   --dry-run   : Simular sem executar
#   -v          : Verbose
#   --transfers 8 : Número de transferências paralelas
#   --checkers 16 : Verificadores paralelos
#
# Comando completo para migração:
#   rclone sync supabase-origin:avatars supabase-dest:avatars \
#     --transfers 8 \
#     --checkers 16 \
#     --progress \
#     --log-file=rclone_migration.log \
#     --log-level INFO
#
# =============================================================================
