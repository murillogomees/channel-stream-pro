name = "iptvlink-cdn-router"
main = "index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Default variables (development)
[vars]
ALLOWED_REFERRERS = "localhost,127.0.0.1,iptvlink.com"

# R2 Bucket binding (UPDATED: novo bucket iptv-m3u-lists)
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "iptv-m3u-lists"
preview_bucket_name = "iptv-m3u-lists-preview"

# Environment: Staging
[env.staging]
name = "iptvlink-cdn-router-staging"
vars = { ENVIRONMENT = "staging" }

[[env.staging.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "iptv-m3u-lists-staging"

# Environment: Production
[env.production]
name = "iptvlink-cdn-router-production"
vars = { ENVIRONMENT = "production", ALLOWED_REFERRERS = "localhost,127.0.0.1,iptvlink.com" }

[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "iptv-m3u-lists"

# Secrets (set via wrangler secret put)
# - JWT_SECRET: JWT signing secret (same as STREAM_PROXY_SECRET in Supabase)
# - SUPABASE_URL: Your Supabase project URL
# - SUPABASE_ANON_KEY: Your Supabase anon key

# To set secrets, run:
# wrangler secret put JWT_SECRET --env production
# wrangler secret put SUPABASE_URL --env production
# wrangler secret put SUPABASE_ANON_KEY --env production
