name = "cache-worker"
main = "index.ts"
compatibility_date = "2024-01-01"

# KV namespace binding
[[kv_namespaces]]
binding = "CACHE_KV"
id = "YOUR_KV_NAMESPACE_ID"

# R2 bucket binding
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "iptvlink-cdn"

[vars]
# Non-sensitive variables

# Secrets (configure via wrangler secret put)
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# WORKER_SECRET
