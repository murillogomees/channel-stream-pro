    <!-- Cache buster script - runs BEFORE React to prevent duplicate instances -->
    <script>
      (function() {
        var CACHE_VERSION = 'v5-fresh';
        var storageKey = 'app_cache_version';
        var lastVersion = localStorage.getItem(storageKey);
        
        // Clear all service worker caches
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) { caches.delete(name); });
          });
        }
        
        // Unregister all service workers
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(registration) {
              registration.unregister();
            });
          });
        }
        
        // Force hard reload if version changed
        if (lastVersion !== CACHE_VERSION) {
          localStorage.setItem(storageKey, CACHE_VERSION);
          if (lastVersion) {
            // Only reload if there was a previous version (not first visit)
            window.location.href = window.location.href.split('?')[0] + '?cb=' + Date.now();
          }
        }
      })();
    </script>

          link.onload = function() {
            document.body.classList.remove('fonts-loading');
            document.body.classList.add('fonts-loaded');
            if (window.performance && performance.mark) {

        // Use requestIdleCallback for truly non-blocking loading
