name: Fix Kong Configuration

on:
  workflow_dispatch:

jobs:
  fix-kong:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Create and validate kong.yml
        run: |
          # Base64 encoded kong.yml
          KONG_YML_B64=""
          
          echo "$KONG_YML_B64" | base64 -d > /tmp/kong.yml
          
          echo "=== kong.yml content ==="
          cat /tmp/kong.yml
          echo "========================"
          
          # Validate with Kong in DB-less mode
          docker run --rm -e KONG_DATABASE=off -v /tmp/kong.yml:/kong.yml kong:2.8.1 kong config parse /kong.yml

      - name: Deploy to VPS and fix Kong
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
        run: |
          # Copy kong.yml to VPS
          sshpass -p "$VPS_PASS" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null /tmp/kong.yml $VPS_USER@$VPS_HOST:/tmp/kong.yml

          # On VPS: fix permissions, copy to all locations, restart
          sshpass -p "$VPS_PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $VPS_USER@$VPS_HOST 'bash -s' << 'ENDSSH'
            set -e

            echo "=== Finding Kong container ==="
            KONG_CONTAINER=$(docker ps -a --format '{{.Names}}' | grep -i kong | head -1)
            echo "Kong container: $KONG_CONTAINER"

            if [ -z "$KONG_CONTAINER" ]; then
              echo "ERROR: Kong container not found!"
              exit 1
            fi

            echo "=== Copying kong.yml to host volume path ./volumes/api/ ==="
            mkdir -p ./volumes/api
            cp /tmp/kong.yml ./volumes/api/kong.yml
            chmod 644 ./volumes/api/kong.yml
            echo "Written to: $(pwd)/volumes/api/kong.yml"
            cat ./volumes/api/kong.yml

            echo "=== Fixing /home/kong permissions via helper container ==="
            docker run --rm --volumes-from $KONG_CONTAINER alpine sh -c '
              mkdir -p /home/kong && 
              chmod 777 /home/kong && 
              rm -f /home/kong/kong.yml || true
            '

            echo "=== Copying kong.yml into container declarative path ==="
            docker cp /tmp/kong.yml $KONG_CONTAINER:/usr/local/kong/declarative/kong.yml

            echo "=== Restarting Kong container ==="
            docker stop $KONG_CONTAINER || true
            sleep 3
            docker start $KONG_CONTAINER

            echo "=== Waiting for Kong to initialize ==="
            sleep 20

            echo "=== Kong status ==="
            docker ps | grep -i kong || true

            echo "=== Kong logs (last 60 lines) ==="
            docker logs $KONG_CONTAINER --tail 60 2>&1 || true
          ENDSSH

      - name: Final verification
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
        run: |
          sshpass -p "$VPS_PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $VPS_USER@$VPS_HOST 'docker ps | grep -i kong || echo "Kong container not running"'
