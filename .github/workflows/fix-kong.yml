name: Fix Kong Configuration

on:
  workflow_dispatch:

jobs:
  fix-kong:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass and Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Create kong.yml file
        run: |
          cat > /tmp/kong.yml << 'EOF'
_format_version: "1.1"
_transform: true

services:
  - name: rest-v1
    url: http://supabase-rest:3000/
    routes:
      - name: rest-v1
        strip_path: true
        paths:
          - /rest/v1/

  - name: auth-v1
    url: http://supabase-auth:9999/
    routes:
      - name: auth-v1
        strip_path: true
        paths:
          - /auth/v1/

  - name: storage-v1
    url: http://supabase-storage:5000/
    routes:
      - name: storage-v1
        strip_path: true
        paths:
          - /storage/v1/

  - name: functions-v1
    url: http://supabase-edge-functions:9000/
    routes:
      - name: functions-v1
        strip_path: true
        paths:
          - /functions/v1/

  - name: realtime-v1
    url: http://realtime-dev.supabase-realtime:4000/socket/
    routes:
      - name: realtime-v1
        strip_path: true
        paths:
          - /realtime/v1/

  - name: meta
    url: http://supabase-meta:8080/
    routes:
      - name: meta
        strip_path: true
        paths:
          - /pg/
EOF

          echo "=== kong.yml content (local) ==="
          cat /tmp/kong.yml
          echo "================================"

      - name: Validate kong.yml syntax with Kong image
        run: |
          docker run --rm -v /tmp/kong.yml:/kong.yml kong:2.8.1 kong config parse /kong.yml

      - name: Deploy kong.yml to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
        run: |
          sshpass -p "$VPS_PASS" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null /tmp/kong.yml $VPS_USER@$VPS_HOST:/tmp/kong.yml

      - name: Apply configuration in Kong container
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
        run: |
          sshpass -p "$VPS_PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $VPS_USER@$VPS_HOST 'bash -s' << 'ENDSSH'
            set -e

            echo "=== Finding Kong container ==="
            KONG_CONTAINER=$(docker ps -a --format '{{.Names}}' | grep -i kong | head -1)
            echo "Kong container: $KONG_CONTAINER"

            if [ -z "$KONG_CONTAINER" ]; then
              echo "ERROR: Kong container not found!"
              exit 1
            fi

            echo "=== Stopping Kong container (if running) ==="
            docker stop $KONG_CONTAINER || true
            sleep 3

            echo "=== Copying kong.yml into container ==="
            docker cp /tmp/kong.yml $KONG_CONTAINER:/usr/local/kong/declarative/kong.yml
            docker cp /tmp/kong.yml $KONG_CONTAINER:/home/kong/kong.yml || true

            echo "=== Starting Kong container ==="
            docker start $KONG_CONTAINER

            echo "=== Waiting for Kong to initialize ==="
            sleep 15

            echo "=== Kong status ==="
            docker ps | grep -i kong || true

            echo "=== Kong logs (last 40 lines) ==="
            docker logs $KONG_CONTAINER --tail 40 2>&1 || true
          ENDSSH

      - name: Final verification
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
        run: |
          sshpass -p "$VPS_PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $VPS_USER@$VPS_HOST 'bash -s' << 'ENDSSH'
            echo "=== Final Kong containers ==="
            docker ps | grep -i kong || true
          ENDSSH
