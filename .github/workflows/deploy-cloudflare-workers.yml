name: Deploy Cloudflare Workers via SSH

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
  workflow_dispatch:
    inputs:
      worker:
        description: 'Worker to deploy (all, rate-limiter, origin-failover)'
        required: false
        default: 'all'

jobs:
  deploy-workers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH with key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
        continue-on-error: true
        id: ssh-key

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Install sshpass for password fallback
        if: steps.ssh-key.outcome == 'failure'
        run: sudo apt-get install -y sshpass

      - name: Copy workers to VPS
        run: |
          if [ "${{ steps.ssh-key.outcome }}" == "success" ]; then
            scp -r workers/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/cloudflare-workers/
          else
            sshpass -p "${{ secrets.VPS_PASS }}" scp -o StrictHostKeyChecking=no -r workers/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/cloudflare-workers/
          fi

      - name: Deploy Workers on VPS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          DEPLOY_SCRIPT='
          set -e
          cd /tmp/cloudflare-workers
          
          # Install Node.js if not present
          if ! command -v node &> /dev/null; then
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi
          
          # Install wrangler globally
          npm install -g wrangler
          
          # Set Cloudflare credentials
          export CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          export CLOUDFLARE_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          
          WORKER_INPUT="${{ github.event.inputs.worker || 'all' }}"
          
          deploy_worker() {
            local worker_dir=$1
            local worker_name=$2
            
            if [ -d "$worker_dir" ]; then
              echo "🚀 Deploying $worker_name..."
              cd "$worker_dir"
              
              # Install dependencies if package.json exists
              if [ -f "package.json" ]; then
                npm install
              fi
              
              # Set secrets
              echo "${{ secrets.SUPABASE_URL }}" | wrangler secret put SUPABASE_URL 2>/dev/null || true
              echo "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | wrangler secret put SUPABASE_SERVICE_ROLE_KEY 2>/dev/null || true
              
              # Deploy
              wrangler deploy
              echo "✅ $worker_name deployed successfully"
              cd ..
            else
              echo "⚠️ Worker directory not found: $worker_dir"
            fi
          }
          
          if [ "$WORKER_INPUT" == "all" ] || [ "$WORKER_INPUT" == "rate-limiter" ]; then
            deploy_worker "rate-limiter-worker" "Rate Limiter Worker"
          fi
          
          if [ "$WORKER_INPUT" == "all" ] || [ "$WORKER_INPUT" == "origin-failover" ]; then
            deploy_worker "origin-failover-worker" "Origin Failover Worker"
          fi
          
          # Cleanup
          rm -rf /tmp/cloudflare-workers
          echo "🎉 Deployment complete!"
          '
          
          if [ "${{ steps.ssh-key.outcome }}" == "success" ]; then
            ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "$DEPLOY_SCRIPT"
          else
            sshpass -p "${{ secrets.VPS_PASS }}" ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "$DEPLOY_SCRIPT"
          fi

      - name: Verify deployment
        run: |
          echo "🔍 Verifying worker deployments..."
          sleep 5
          
          # Health check URLs would go here if workers have health endpoints
          echo "✅ Workflow completed successfully"
