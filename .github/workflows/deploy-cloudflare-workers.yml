name: Deploy Cloudflare Workers via SSH

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
  workflow_dispatch:
    inputs:
      worker:
        description: 'Worker to deploy (all, rate-limiter, origin-failover)'
        required: false
        default: 'all'

jobs:
  deploy-workers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Copy workers to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
        run: |
          # Create remote directory and copy workers
          sshpass -p "$VPS_PASS" ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "rm -rf /tmp/cloudflare-workers && mkdir -p /tmp/cloudflare-workers"
          sshpass -p "$VPS_PASS" scp -o StrictHostKeyChecking=no -r workers/* $VPS_USER@$VPS_HOST:/tmp/cloudflare-workers/

      - name: Deploy Workers via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WORKER_INPUT: ${{ github.event.inputs.worker || 'all' }}
        run: |
          sshpass -p "$VPS_PASS" ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << 'ENDSSH'
          set -e
          
          echo "🚀 Starting Cloudflare Workers deployment..."
          
          # Export Cloudflare credentials
          export CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          export CLOUDFLARE_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          
          # Install Node.js if not present
          if ! command -v node &> /dev/null; then
            echo "📦 Installing Node.js..."
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            apt-get install -y nodejs
          fi
          
          # Install wrangler if not present
          if ! command -v wrangler &> /dev/null; then
            echo "📦 Installing wrangler..."
            npm install -g wrangler
          fi
          
          cd /tmp/cloudflare-workers
          
          WORKER_INPUT="${{ github.event.inputs.worker || 'all' }}"
          
          # Deploy rate-limiter-worker
          if [ "$WORKER_INPUT" == "all" ] || [ "$WORKER_INPUT" == "rate-limiter" ]; then
            if [ -d "rate-limiter-worker" ]; then
              echo "🚀 Deploying rate-limiter-worker..."
              cd rate-limiter-worker
              
              # Create simplified wrangler.toml without KV (for initial deploy)
              cat > wrangler.toml << 'EOF'
          name = "iptv-rate-limiter"
          main = "index.ts"
          compatibility_date = "2024-01-01"
          
          [vars]
          ENVIRONMENT = "production"
          EOF
              
              wrangler deploy
              
              # Set secrets
              echo "${{ secrets.SUPABASE_URL }}" | wrangler secret put SUPABASE_URL || true
              echo "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | wrangler secret put SUPABASE_SERVICE_ROLE_KEY || true
              
              cd ..
              echo "✅ rate-limiter-worker deployed"
            fi
          fi
          
          # Deploy origin-failover-worker
          if [ "$WORKER_INPUT" == "all" ] || [ "$WORKER_INPUT" == "origin-failover" ]; then
            if [ -d "origin-failover-worker" ]; then
              echo "🚀 Deploying origin-failover-worker..."
              cd origin-failover-worker
              
              # Create simplified wrangler.toml without KV (for initial deploy)
              cat > wrangler.toml << 'EOF'
          name = "iptv-origin-failover"
          main = "index.ts"
          compatibility_date = "2024-01-01"
          
          [vars]
          ENVIRONMENT = "production"
          EOF
              
              wrangler deploy
              
              # Set secrets
              echo "${{ secrets.SUPABASE_URL }}" | wrangler secret put SUPABASE_URL || true
              echo "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | wrangler secret put SUPABASE_SERVICE_ROLE_KEY || true
              
              cd ..
              echo "✅ origin-failover-worker deployed"
            fi
          fi
          
          # Cleanup
          rm -rf /tmp/cloudflare-workers
          
          echo "🎉 Deployment complete!"
          ENDSSH

      - name: Verify deployment
        run: |
          echo "✅ Cloudflare Workers deployment workflow completed"
          echo "Check Cloudflare dashboard for worker status"
