name: Deploy Edge Functions to Self-Hosted Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy all functions'
        required: false
        default: 'false'
      restart_container:
        description: 'Restart edge-runtime container after deploy (caution!)'
        required: false
        default: 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List functions to deploy
        run: |
          echo "📋 Edge Functions in this commit:"
          ls -la supabase/functions/
          echo ""
          echo "📦 Functions with index.ts:"
          find supabase/functions -name "index.ts" -type f | sed 's|supabase/functions/||' | sed 's|/index.ts||' | sort

      - name: Notify deployment ready
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
        run: |
          echo "✅ Edge Functions code updated in repository"
          echo ""
          echo "=========================================="
          echo "⚠️  MANUAL ACTION REQUIRED"
          echo "=========================================="
          echo ""
          echo "The edge functions code has been updated."
          echo "To apply changes, restart ONLY the edge-runtime"
          echo "container via Coolify dashboard:"
          echo ""
          echo "1. Go to: ${COOLIFY_URL:-https://dashboard.iptvlink.com.br}"
          echo "2. Find the Supabase service"
          echo "3. Restart ONLY the 'functions' or 'edge-runtime' container"
          echo "4. Do NOT restart the entire Supabase service"
          echo ""
          echo "=========================================="

      - name: Verify functions endpoint
        env:
          SUPABASE_URL: ${{ secrets.SELFHOSTED_SUPABASE_URL }}
        run: |
          echo "🔍 Checking current functions status..."
          
          CHECK_URL="${SUPABASE_URL:-https://supabase.iptvlink.com.br}"
          
          # Check health endpoint
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${CHECK_URL}/functions/v1/health-check" 2>/dev/null || echo "000")
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Functions endpoint is healthy (HTTP $HTTP_CODE)"
          else
            echo "⚠️ Functions endpoint returned HTTP $HTTP_CODE"
            echo "   This may be normal if container hasn't been restarted yet"
          fi

      - name: Summary
        run: |
          echo ""
          echo "=========================================="
          echo "📊 Deployment Summary"
          echo "=========================================="
          echo "Status: Code pushed to repository"
          echo "Functions updated: $(find supabase/functions -name 'index.ts' | wc -l)"
          echo "Auto-restart: DISABLED (manual restart required)"
          echo ""
          echo "Next step: Restart edge-runtime container via Coolify"
          echo "=========================================="
