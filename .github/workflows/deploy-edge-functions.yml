name: Deploy Edge Functions to Self-Hosted Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy all functions'
        required: false
        default: 'true'
      restart_container:
        description: 'Restart edge-runtime container after deploy'
        required: false
        default: 'true'

env:
  VPS_HOST: srv1182856.hstgr.cloud
  VPS_USER: root
  FUNCTIONS_PATH: /root/supabase/docker/volumes/functions
  COOLIFY_URL: https://dashboard.iptvlink.com.br
  SUPABASE_URL: https://supabase.iptvlink.com.br

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List functions to deploy
        run: |
          echo "📋 Edge Functions in this commit:"
          ls -la supabase/functions/
          echo ""
          echo "📦 Functions with index.ts:"
          find supabase/functions -name "index.ts" -type f | sed 's|supabase/functions/||' | sed 's|/index.ts||' | sort
          echo ""
          echo "Total: $(find supabase/functions -name 'index.ts' | wc -l) functions"

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy functions via SSH
        env:
          VPS_PASS: ${{ secrets.VPS_PASS }}
        run: |
          echo "🚀 Deploying edge functions to self-hosted Supabase..."
          
          # Create temp directory on server
          sshpass -p "$VPS_PASS" ssh -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "mkdir -p /tmp/functions-deploy"
          
          # Copy all functions
          sshpass -p "$VPS_PASS" scp -o StrictHostKeyChecking=no -r supabase/functions/* ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/tmp/functions-deploy/
          
          # Backup existing and deploy new
          sshpass -p "$VPS_PASS" ssh -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
            set -e
            
            echo "📁 Backing up existing functions..."
            FUNCTIONS_PATH="/root/supabase/docker/volumes/functions"
            if [ -d "$FUNCTIONS_PATH" ]; then
              cp -r $FUNCTIONS_PATH ${FUNCTIONS_PATH}.backup.$(date +%Y%m%d_%H%M%S) 2>/dev/null || true
            fi
            
            echo "📦 Deploying new functions..."
            mkdir -p $FUNCTIONS_PATH
            cp -r /tmp/functions-deploy/* $FUNCTIONS_PATH/
            
            echo "🧹 Cleaning temp files..."
            rm -rf /tmp/functions-deploy
            
            echo "✅ Functions deployed successfully!"
            ls -la $FUNCTIONS_PATH/
          ENDSSH

      - name: Restart edge-runtime container via Coolify API
        if: ${{ github.event.inputs.restart_container != 'false' }}
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          echo "🔄 Restarting edge-runtime container via Coolify API..."
          
          # Get Supabase service UUID
          SERVICE_UUID="vcs0c0k8kww48kgws44swkk0"
          
          # Trigger restart
          RESPONSE=$(curl -s -X GET \
            "${{ env.COOLIFY_URL }}/api/v1/services/${SERVICE_UUID}/restart" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Accept: application/json")
          
          echo "Coolify API Response: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q "restarting\|queued"; then
            echo "✅ Restart triggered successfully!"
          else
            echo "⚠️ Restart may have failed, check Coolify dashboard"
          fi

      - name: Wait for services to restart
        if: ${{ github.event.inputs.restart_container != 'false' }}
        run: |
          echo "⏳ Waiting 60 seconds for containers to restart..."
          sleep 60

      - name: Verify deployment
        run: |
          echo "🔍 Verifying edge functions deployment..."
          
          # Check health endpoint
          for i in {1..5}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.SUPABASE_URL }}/functions/v1/health-check" 2>/dev/null || echo "000")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Functions endpoint is healthy (HTTP $HTTP_CODE)"
              break
            else
              echo "⏳ Attempt $i/5: Functions endpoint returned HTTP $HTTP_CODE"
              if [ $i -lt 5 ]; then
                sleep 15
              fi
            fi
          done

      - name: Test iptv-play function
        run: |
          echo "🎬 Testing iptv-play function..."
          
          RESPONSE=$(curl -s -X GET "${{ env.SUPABASE_URL }}/functions/v1/iptv-play?channelId=12" \
            -H "Content-Type: application/json" 2>/dev/null || echo '{"error":"connection failed"}')
          
          echo "Response: $RESPONSE"
          
          # Check if we get expected error (no token) instead of 500
          if echo "$RESPONSE" | grep -q "Unauthorized\|No token"; then
            echo "✅ iptv-play function is responding correctly (auth required)"
          elif echo "$RESPONSE" | grep -q "Internal server error"; then
            echo "❌ iptv-play still returning 500 error"
            exit 1
          else
            echo "⚠️ Unexpected response, check logs"
          fi

      - name: Summary
        run: |
          echo ""
          echo "=========================================="
          echo "📊 Deployment Summary"
          echo "=========================================="
          echo "Status: ✅ Completed"
          echo "Functions deployed: $(find supabase/functions -name 'index.ts' | wc -l)"
          echo "Container restart: ${{ github.event.inputs.restart_container != 'false' && 'Yes' || 'No' }}"
          echo "Target: ${{ env.SUPABASE_URL }}"
          echo "=========================================="
