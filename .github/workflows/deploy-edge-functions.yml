name: Deploy Edge Functions to Self-Hosted Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy all functions'
        required: false
        default: 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Create functions archive
        run: |
          echo "📦 Creating functions archive..."
          cd supabase/functions
          tar -czvf /tmp/functions.tar.gz .
          echo "✅ Archive created with $(tar -tzf /tmp/functions.tar.gz | wc -l) files"

      - name: Deploy to VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
          FUNCTIONS_PATH: ${{ secrets.FUNCTIONS_PATH }}
        run: |
          echo "🚀 Deploying Edge Functions to VPS..."
          
          # Default path if not set
          DEPLOY_PATH="${FUNCTIONS_PATH:-/data/coolify/services/vcs0c0k8kww48kgws44swkk0/volumes/functions}"
          
          # Disable strict host key checking for automation
          export SSHPASS="$VPS_PASS"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          
          # Copy archive to VPS
          echo "📤 Copying functions archive..."
          sshpass -e scp $SSH_OPTS /tmp/functions.tar.gz ${VPS_USER}@${VPS_HOST}:/tmp/functions.tar.gz
          
          # Extract and deploy on VPS
          echo "📂 Extracting and deploying..."
          sshpass -e ssh $SSH_OPTS ${VPS_USER}@${VPS_HOST} << ENDSSH
            set -e
            
            echo "🔍 Finding functions directory..."
            FUNCTIONS_DIR="$DEPLOY_PATH"
            
            # Try to find the correct path if default doesn't exist
            if [ ! -d "\$FUNCTIONS_DIR" ]; then
              echo "Default path not found, searching..."
              FUNCTIONS_DIR=\$(find /data/coolify -name "functions" -type d 2>/dev/null | grep -E "volumes/functions$" | head -1)
            fi
            
            if [ -z "\$FUNCTIONS_DIR" ]; then
              echo "❌ Could not find functions directory"
              exit 1
            fi
            
            echo "📁 Deploying to: \$FUNCTIONS_DIR"
            
            # Backup existing functions
            BACKUP_DIR="/tmp/functions-backup-\$(date +%Y%m%d%H%M%S)"
            if [ -d "\$FUNCTIONS_DIR" ]; then
              echo "💾 Creating backup at \$BACKUP_DIR"
              cp -r "\$FUNCTIONS_DIR" "\$BACKUP_DIR" 2>/dev/null || true
            fi
            
            # Extract new functions
            echo "📦 Extracting new functions..."
            mkdir -p "\$FUNCTIONS_DIR"
            cd "\$FUNCTIONS_DIR"
            tar -xzvf /tmp/functions.tar.gz --overwrite
            
            # Find and restart edge-runtime container
            echo "🔄 Restarting edge-runtime..."
            CONTAINER_ID=\$(docker ps -q --filter "ancestor=supabase/edge-runtime:v1.67.4" | head -1)
            
            if [ -n "\$CONTAINER_ID" ]; then
              docker restart \$CONTAINER_ID
              echo "✅ Edge runtime restarted: \$CONTAINER_ID"
              
              # Wait for container to be ready
              sleep 5
              
              # Verify container is running
              if docker ps -q --filter "id=\$CONTAINER_ID" | grep -q .; then
                echo "✅ Container is running"
              else
                echo "⚠️ Container may have issues, checking logs..."
                docker logs --tail 20 \$CONTAINER_ID 2>/dev/null || true
              fi
            else
              echo "⚠️ Edge runtime container not found with image filter"
              echo "Trying alternative search..."
              CONTAINER_ID=\$(docker ps --format '{{.ID}} {{.Image}}' | grep -i edge | awk '{print \$1}' | head -1)
              if [ -n "\$CONTAINER_ID" ]; then
                docker restart \$CONTAINER_ID
                echo "✅ Restarted container: \$CONTAINER_ID"
              else
                echo "❌ No edge runtime container found"
              fi
            fi
            
            # Cleanup
            rm -f /tmp/functions.tar.gz
            
            echo "✅ Deploy complete!"
          ENDSSH

      - name: Restart Edge Functions via Coolify API
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          EDGE_FUNCTIONS_UUID: ${{ secrets.EDGE_FUNCTIONS_UUID }}
        run: |
          echo "🔄 Restarting Edge Functions via Coolify API..."
          
          # Default Coolify URL if not set
          API_URL="${COOLIFY_URL:-https://dashboard.iptvlink.com.br}"
          
          if [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "⚠️ COOLIFY_API_TOKEN not set, skipping API restart"
            exit 0
          fi
          
          # Get service UUID if not explicitly set
          SERVICE_UUID="${EDGE_FUNCTIONS_UUID}"
          
          if [ -z "$SERVICE_UUID" ]; then
            echo "🔍 Finding Edge Functions service UUID..."
            SERVICES=$(curl -s -X GET "${API_URL}/api/v1/services" \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              -H "Content-Type: application/json")
            
            # Try to find edge-runtime or functions service
            SERVICE_UUID=$(echo "$SERVICES" | jq -r '.[] | select(.name | test("edge|function"; "i")) | .uuid' | head -1)
          fi
          
          if [ -z "$SERVICE_UUID" ] || [ "$SERVICE_UUID" = "null" ]; then
            echo "⚠️ Could not find Edge Functions service UUID"
            echo "Falling back to Docker restart (already done in previous step)"
            exit 0
          fi
          
          echo "📡 Restarting service: $SERVICE_UUID"
          
          # Restart the service via Coolify API
          RESPONSE=$(curl -s -X POST "${API_URL}/api/v1/services/${SERVICE_UUID}/restart" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json")
          
          echo "Response: $RESPONSE"
          
          # Check if restart was successful
          if echo "$RESPONSE" | grep -qi "error"; then
            echo "⚠️ Coolify API restart may have failed, but Docker restart was done"
          else
            echo "✅ Edge Functions service restart initiated via Coolify API"
          fi
          
          # Wait for service to come back up
          echo "⏳ Waiting for service to restart..."
          sleep 15

      - name: Verify Deployment
        env:
          SUPABASE_URL: ${{ secrets.SELFHOSTED_SUPABASE_URL }}
        run: |
          echo "🔍 Verifying deployment..."
          sleep 10
          
          # Use default URL if secret not set
          CHECK_URL="${SUPABASE_URL:-https://supabase.iptvlink.com.br}"
          
          # Check health endpoint
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${CHECK_URL}/functions/v1/health-check" || echo "000")
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Health check passed (HTTP $HTTP_CODE)"
          else
            echo "⚠️ Health check returned HTTP $HTTP_CODE (may still be starting)"
          fi
          
          # Check main router
          ROUTER_RESPONSE=$(curl -s "${CHECK_URL}/functions/v1/main" || echo "{}")
          echo "Router response: $ROUTER_RESPONSE"
          
          echo "✅ Deployment verification complete"
