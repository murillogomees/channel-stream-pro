name: Fix PostgREST Configuration

on:
  workflow_dispatch:

jobs:
  fix-postgrest:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Fix PostgREST and Database Configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
        run: |
          sshpass -p "$VPS_PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $VPS_USER@$VPS_HOST 'bash -s' << 'ENDSSH'
            set -e
            
            echo "=============================================="
            echo "   FIX POSTGREST - SELF-HOSTED SUPABASE"
            echo "=============================================="
            
            # Find containers
            echo "📦 Localizando containers..."
            DB_CONTAINER=$(docker ps --format '{{.Names}}' | grep -Ei 'supabase.*db' | head -1)
            REST_CONTAINER=$(docker ps --format '{{.Names}}' | grep -Ei 'supabase.*rest' | head -1)
            
            echo "  DB Container: $DB_CONTAINER"
            echo "  REST Container: $REST_CONTAINER"
            
            if [ -z "$DB_CONTAINER" ]; then
              echo "❌ ERRO: Container do PostgreSQL não encontrado!"
              docker ps --format "table {{.Names}}\t{{.Image}}"
              exit 1
            fi
            
            # Use the correct password
            POSTGRES_PASS="p72qeBb4xpFYLvg8dggpeJW08Q4xgR9A"
            echo "  ✅ Usando senha conhecida"
            
            # Create/update roles
            echo "👤 Criando/atualizando roles..."
            docker exec $DB_CONTAINER psql -U postgres -d postgres << SQLEOF
            DO \$\$
            BEGIN
              -- Create roles if they don't exist
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN
                CREATE ROLE anon NOLOGIN NOINHERIT;
              END IF;
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN
                CREATE ROLE authenticated NOLOGIN NOINHERIT;
              END IF;
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'service_role') THEN
                CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS;
              END IF;
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticator') THEN
                CREATE ROLE authenticator NOINHERIT LOGIN PASSWORD '${POSTGRES_PASS}';
              ELSE
                ALTER ROLE authenticator WITH PASSWORD '${POSTGRES_PASS}' LOGIN NOINHERIT;
              END IF;
            END
            \$\$;
            
            -- Grant roles to authenticator
            GRANT anon TO authenticator;
            GRANT authenticated TO authenticator;
            GRANT service_role TO authenticator;
            
            -- Grant schema permissions
            GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role;
            GRANT ALL ON ALL TABLES IN SCHEMA public TO anon, authenticated, service_role;
            GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO anon, authenticated, service_role;
            GRANT ALL ON ALL ROUTINES IN SCHEMA public TO anon, authenticated, service_role;
            
            -- Set default privileges
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon, authenticated, service_role;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO anon, authenticated, service_role;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON ROUTINES TO anon, authenticated, service_role;
            
            -- Verify
            SELECT rolname, rolcanlogin, rolinherit FROM pg_roles 
            WHERE rolname IN ('anon', 'authenticated', 'service_role', 'authenticator');
            SQLEOF
            
            echo "  ✅ Roles configuradas"
            
            # Restart PostgREST
            echo "🔄 Reiniciando PostgREST..."
            if [ -n "$REST_CONTAINER" ]; then
              docker restart $REST_CONTAINER
              echo "  ✅ PostgREST reiniciado"
              sleep 8
            fi
            
            echo "=============================================="
            echo "   CONFIGURAÇÃO CONCLUÍDA"
            echo "=============================================="
          ENDSSH

      - name: Test REST API
        run: |
          echo "Testing REST API..."
          sleep 5
          curl -i "https://supabase.iptvlink.com.br/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSIsImlhdCI6MTc2NTIyMDgyMCwiZXhwIjo0OTIwODk0NDIwLCJyb2xlIjoiYW5vbiJ9.55tQdiEEa0mlCvveFpQZwMHqDZt0DzAgUQOPpLCNDLU"
