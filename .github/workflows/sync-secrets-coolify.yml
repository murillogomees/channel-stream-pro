name: Sync Secrets to Coolify

on:
  workflow_dispatch:
    inputs:
      secrets_to_sync:
        description: 'Comma-separated list of secrets to sync (or "all")'
        required: false
        default: 'all'

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    
    steps:
      - name: Sync Secrets to Coolify
        run: |
          echo "🔐 Syncing secrets to Coolify..."
          
          # Define secrets to sync
          declare -A SECRETS=(
            ["SELFHOSTED_DB_URL"]="${{ secrets.SELFHOSTED_DB_URL }}"
            ["JWT_SECRET"]="${{ secrets.JWT_SECRET }}"
            ["SUPABASE_URL"]="${{ secrets.SUPABASE_URL }}"
            ["SUPABASE_ANON_KEY"]="${{ secrets.SUPABASE_ANON_KEY }}"
            ["SUPABASE_SERVICE_ROLE_KEY"]="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
            ["MERCADO_PAGO_ACCESS_TOKEN"]="${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}"
            ["MERCADO_PAGO_WEBHOOK_SECRET"]="${{ secrets.MERCADO_PAGO_WEBHOOK_SECRET }}"
            ["WHATSAPP_APPKEY"]="${{ secrets.WHATSAPP_APPKEY }}"
            ["WHATSAPP_AUTHKEY"]="${{ secrets.WHATSAPP_AUTHKEY }}"
            ["CRON_SECRET"]="${{ secrets.CRON_SECRET }}"
            ["TMDB_API_KEY"]="${{ secrets.TMDB_API_KEY }}"
          )
          
          for KEY in "${!SECRETS[@]}"; do
            VALUE="${SECRETS[$KEY]}"
            if [ -n "$VALUE" ]; then
              echo "Setting $KEY..."
              curl -X POST "https://dashboard.iptvlink.com.br/api/v1/services/vcs0c0k8kww48kgws44swkk0/envs" \
                -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
                -H "Content-Type: application/json" \
                -d "{\"key\": \"$KEY\", \"value\": \"$VALUE\", \"is_preview\": false}" \
                || echo "Failed to set $KEY"
            else
              echo "Skipping $KEY (not configured)"
            fi
          done
          
          echo "✅ Secrets sync complete!"

      - name: Restart Service
        run: |
          curl -X POST "https://dashboard.iptvlink.com.br/api/v1/services/vcs0c0k8kww48kgws44swkk0/restart" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json"
          echo "🔄 Service restart requested"
